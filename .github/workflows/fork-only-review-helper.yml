name: Fork-only review helper
run-name: Request changes on fork PR #${{ inputs.pr_number }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Fork pull request number
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write

jobs:
  request-changes:
    if: github.repository == 'ZhanruiSunCh/TensorRT-LLM'
    runs-on: ubuntu-latest
    steps:
      - name: Submit a blocking review from github-actions[bot]
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(${{ inputs.pr_number }}),
              event: 'REQUEST_CHANGES',
              body: 'Fork-only E2E blocker for dismissal testing.'
            });
